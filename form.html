<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Form</title>
  </head>
  <body>
    <h2 >Form </h2>
    <form action="" method="">
      <label for="fname">FIrst Name</label>
      <input type="text" id="fname" name="fname" placeholder="Your First Name">
      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="lname" placeholder="Your Last Name">
      <label for="email">Email</label>
      <input type="email" id="email" name="Email" palceholder="Your Email">
      <label for="phone"> Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="Your contact No.">

      <fieldset>
        <legend>Preferences</legend>
        <label for="drink">Favorite Drink</label>
        <select id="drink" name="drink">
          <option value="coffee">Coffee</option>
          <option value="tea">Tea</option>
          <option value="juice">Juice</option>
        </select>
      </fieldset>
      <fieldset>
        <legend>Pet</legend>
        <label for="pet">Do you have a pet</label>
        <input type="radio" id="yes" name="pet" value="yes">
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="pet" value="no">
        <label for="no">No</label>
      </fieldset>
      <fieldset>
        <legend>Hobbies</legend>
        <label for="hobby1">Reading</label>
        <input type="checkbox" id="hobby1" name="hobby" value="reading">
        <label for="hobby2">Traveling</label>
        <input type="checkbox" id="hobby2" name="hobby" value="traveling">
        <label for="hobby3">Cooking</label>
        <input type="checkbox" id="hobby3" name="hobby" value="cooking">
        </fieldset>
      <input type="submit" value="Submit">
      <button type="submit" formaction="" formmethod="post" >Submit</button>
    </form>
  </body>
</html>
